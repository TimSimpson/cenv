[package]
name = "cenv"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "cenv"
crate-type = ["cdylib", "lib"]

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[dependencies]
eyre = "0.6.12"
pyo3 = "0.24.0"


